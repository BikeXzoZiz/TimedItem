  expire: "&cYour item has expired and was removed!"
  expire_soon: "&eYour item will expire in &c{time}&e!"
  no_item: "&cHold the item you want to manage first."
  player_only: "&cOnly players can use this command."
  no_timer: "&7The item in your hand has no timer."
  item_cleared: "&aTimer removed from the item in your hand."
  time_added: "&aTime added. Remaining: &e{time}"
  timer_paused: "&aTimer paused with &e{time}&a remaining."
  timer_resumed: "&aTimer resumed. Expires in &e{time}&a."
  timer_not_started: "&7The timer on this item has not started yet."
  already_paused: "&7The timer on this item is already paused."
  already_running: "&7The timer on this item is already running."
  invalid_usage: "&cUsage: /ti set <time>, /ti add <time>, /ti give <player> [plugin:id] <time> [amount], /ti pause, /ti resume, /ti remove, /ti info, /ti menu, /ti restore, /ti debug, /ti reload"
  config_reload: "&aTimedItem config reloaded."
  time_set: "&aTimer set: &e{time}"
  info_remaining: "&7Time remaining: &e{time}"
  info_lifetime: "&7Lifetime: &e{time} &7(starts on first use)"
  give_sent: "&aGave a timed item (&e{time}&a) to &e{player}&a."
  give_received: "&aYou received a timed item expiring in &e{time}&a."
  target_not_found: "&cPlayer &e{player} &cis not online."
  material_blacklisted: "&cThis item's material cannot carry a TimedItem timer."
  restore_given: "&aRecovered the item from the expiry log."
  restore_empty: "&7The expiry recovery log is empty."
  update_available: "&eTimedItem &6{version} &eis available: &7{url}"
  debug_status: "&7Debug mode: &e{state}&7. Buffered log entries: &e{entries}&7. Recovery entries: &e{recovery}&7. Item storage: &e{storage}&7."
  debug_on: "&aDebug mode enabled - verbose TimedItem logging is now visible in the console. Use /ti debug export to write a bug report."
  debug_off: "&7Debug mode disabled."
  debug_exported: "&aDebug report written to &e{file}"
  debug_export_failed: "&cCould not write the debug report: &7{error}"
  debug_usage: "&7Usage: /ti debug [on|off|export]"
  item_not_found: "&cUnknown custom item: &e{id}&c. Use <plugin>:<id>, e.g. mmoitems:SWORD:CUTLASS."
  find_usage: "&7Usage: /ti find <material|plugin:id|name>"
  find_no_match: "&7No timed items matching &e{query} &7were found."
  find_result: "&aFound &e{count} &atimed item(s) matching &e{query}&a:"
  find_truncated: "&7...and &e{rest} &7more (showing the first {shown})."
  find_hit_player: " &8- &e{player} &7(slot {slot})"
  find_hit_container: " &8- &7{world} &e{x},{y},{z} &7({type})"
  find_hit_ground: " &8- &7{world} &e{x},{y},{z}"
  stats_header: "&6Expired items (last {days} days):"
  stats_line: " &e{material}&7: &a{count}"
  stats_total: "&7Total expired: &e{count}"
  stats_empty: "&7No items have expired in the last {days} days."
  audit_header: "&6Audit log (page {page}):"
  audit_line: " &8[{date}] &e{actor} &7{action} &7target=&f{target} &7item=&f{item} &7{details}"
  audit_empty: "&7The audit log is empty."
  transform_received: "&7Your expired item turned into &e{item}&7."
  grace_blocked: "&cThis item expires in &e{time} &cand can no longer be used!"
  renewal_success: "&aRenewed with a token. Remaining: &e{time}"
  renewal_token_missing: "&7Hold the item to renew in one hand and the renewal token in the other."
  restore_reminder: "&eYou have &6{count} &eexpired item(s) waiting for restore. &7(/ti restore)"
  transform_unknown: "&cUnknown transform profile: &e{id}&c. Define it under Settings.transforms."

DateFormat:
  # Lore prefixes shown on timed items. Changing these after items with
  # timers already exist will make those items unrecognizable (they are
  # also how lore-only items on 1.13 store their timer).
  # Avoid a trailing "&s" (it would collide with the internal separator).
  expires_at: "&cExpires: "
  useful_life: "&7Lifetime: "
  # Shown on items whose timer was frozen with /ti pause
  paused: "&7Paused: "
  playtime: "&6Playtime: "
  held: "&6Held time: "
  # Unit labels used by /ti set and shown in the lore, e.g. 1d12h30m.
  # Keep these identical across language files and do not change them
  # once items exist - the label is part of the stored lore format.
  s: "s"
  m: "m"
  h: "h"
  d: "d"

Gui:
  # Labels of the /ti menu and /ti restore GUIs.
  menu_title: "&6TimedItem Menu"
  preset_lore: "&7Set this lifetime on the item in your hand"
  toggle_name: "&6Pause / Resume"
  toggle_lore: "&7Freeze the countdown, or resume a paused item"
  remove_name: "&cRemove timer"
  remove_lore: "&7Strip the timer from the item in your hand"
  close_name: "&cClose"
  status_name: "&6Held item status"
  status_no_timer: "&7Held item: &cno timer"
  status_type_expire: "&7Type: &eexpire"
  status_type_paused: "&7Type: &epaused"
  status_type_lifetime: "&7Type: &elifetime (not started)"
  status_type_playtime: "&7Type: &eplaytime (while online)"
  status_type_held: "&7Type: &eheld time (while held/worn)"
  status_remaining: "&7Remaining: &e{time}"
  status_expires_at: "&7Expires at: &e{date}"
  status_duration: "&7Duration: &e{time}"
  restore_title: "&8TimedItem Restore &7({page}/{pages})"
  restore_date: "&8{date}"
  restore_player: "&7Player: &e{player}"
  restore_world: "&7World: &e{world}"
  restore_click: "&aClick to recover"
  restore_prev: "&ePrevious page"
  restore_next: "&eNext page"
