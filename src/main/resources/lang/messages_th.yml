DateFormat:
  # Prefix ที่เขียนลง lore ของไอเทม — ห้ามแก้หลังมีไอเทมที่มี timer อยู่แล้ว
  # (เป็นตัวระบุบรรทัด lore ตอนอ่านค่า โดยเฉพาะบนเซิร์ฟ 1.13 ที่เก็บใน lore)
  # หลีกเลี่ยง "&s" ท้ายค่า (จะชนกับตัวคั่นภายใน)
  expires_at: "&cหมดอายุ: "
  useful_life: "&7อายุการใช้งาน: "
  # แสดงบนไอเทมที่หยุดเวลาไว้ด้วย /ti pause
  paused: "&7หยุดไว้: "
  playtime: "&6เวลาเล่น: "
  held: "&6เวลาถือ: "
  # หน่วยเวลาที่ใช้กับ /ti set และแสดงใน lore เช่น 1d12h30m
  # ให้เหมือนกันทุกไฟล์ภาษา และห้ามแก้หลังมีไอเทมอยู่แล้ว
  # เพราะหน่วยเป็นส่วนหนึ่งของฟอร์แมต lore ที่เก็บไว้
  s: "s"
  m: "m"
  h: "h"
  d: "d"

