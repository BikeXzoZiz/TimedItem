# TimedItem 2.3.0
# Every key has a built-in default - if a key is missing the default is
# used and written back to this file, so a partial config never crashes.

config-version: 5

Messages:
  prefix: "&6[TimedItem] &r"
  expire: "&cYour item has expired and was removed!"
  expire_soon: "&eYour item will expire in &c{time}&e!"
  no_item: "&cHold the item you want to manage first."
  player_only: "&cOnly players can use this command."
  no_timer: "&7The item in your hand has no timer."
  item_cleared: "&aTimer removed from the item in your hand."
  time_added: "&aTime added. Remaining: &e{time}"
  timer_paused: "&aTimer paused with &e{time}&a remaining."
  timer_resumed: "&aTimer resumed. Expires in &e{time}&a."
  timer_not_started: "&7The timer on this item has not started yet."
  already_paused: "&7The timer on this item is already paused."
  already_running: "&7The timer on this item is already running."
  invalid_usage: "&cUsage: /ti set <time>, /ti add <time>, /ti give <player> <time> [amount], /ti pause, /ti resume, /ti remove, /ti info, /ti menu, /ti restore, /ti reload"
  config_reload: "&aTimedItem config reloaded."
  time_set: "&aTimer set: &e{time}"
  info_remaining: "&7Time remaining: &e{time}"
  info_lifetime: "&7Lifetime: &e{time} &7(starts on first use)"
  give_sent: "&aGave a timed item (&e{time}&a) to &e{player}&a."
  give_received: "&aYou received a timed item expiring in &e{time}&a."
  target_not_found: "&cPlayer &e{player} &cis not online."
  material_blacklisted: "&cThis item's material cannot carry a TimedItem timer."
  restore_given: "&aRecovered the item from the expiry log."
  restore_empty: "&7The expiry recovery log is empty."
  update_available: "&eTimedItem &6{version} &eis available: &7{url}"

DateFormat:
  # Lore prefixes shown on timed items. Changing these after items with
  # timers already exist will make those items unrecognizable.
  # Avoid a trailing "&s" (it would collide with the internal separator).
  expires_at: "&cExpires: "
  useful_life: "&7Lifetime: "
  # Shown on items whose timer was frozen with /ti pause
  paused: "&7Paused: "
  # Unit labels used by /ti set and shown in the lore, e.g. 1d12h30m
  s: "s"
  m: "m"
  h: "h"
  d: "d"

Settings:
  # true  = the timer starts counting on the item's first click/use
  # false = the timer starts immediately when /ti set is used
  start_date_calculate_on_click: true
  # Reset the player's max health to 20 when expired armor is removed
  # (anti-exploit for health-boosting timed armor).
  reset_player_health_if_armor: true
  # Anonymous usage statistics via bStats (https://bstats.org)
  metrics: true
  expire_check:
    # Also check every online player's inventory periodically, instead of
    # only on inventory click / item use / join / damage events.
    enabled: true
    interval_seconds: 10
    # Also scan ground items, item frames and armor stands for expired
    # items every interval. Off by default - it walks every loaded world.
    scan_world_items: false
  warning:
    # Message + sound when an item enters its final seconds.
    # Requires expire_check to be enabled.
    enabled: true
    # Single-stage fallback used when "stages" is empty.
    seconds: 60
    # One warning per threshold (seconds of remaining time), fired as the
    # item counts down through each. Example for warnings at 10m, 1m and 10s:
    # stages: [600, 60, 10]
    stages: [60]
    sound:
      name: "block.note_block.pling"
      volume: 1.0
      pitch: 1.5
  particles:
    # Effect played at the player when an item expires.
    enabled: true
    # Particle name, e.g. FLAME, CRIT, SMOKE, HEART (unknown names fall back to FLAME)
    name: "FLAME"
    count: 30
  expiry_commands:
    # Console commands run when a player's item expires, {player} available. e.g.:
    # - "say {player}'s timed item expired!"
    # - "give {player} diamond 1"
    # Ground/frame expiry has no player: commands containing {player} are
    # skipped, the rest still run.
    []
  sound:
    # Played at the player when an item expires. The name is a sound key
    # which works on every 1.13+ server:
    # https://minecraft.wiki/w/Sounds.json
    enabled: true
    name: "entity.blaze.death"
    volume: 10.0
    pitch: 1.2
  actionbar:
    # Shows the remaining time in the actionbar while holding a timed item
    # (counting down, paused and not-yet-started lifetimes).
    enabled: true
    format: "&e⌛ {time}"
  update_check:
    # Check GitHub Releases for a newer TimedItem version and notify the
    # console and admins on join.
    enabled: true
    # GitHub repository as owner/name used for the release check.
    repository: "BikeXzoZiz/TimedItem"
  recovery:
    # Save every expired item to plugins/TimedItem/recovery.log so admins
    # can hand it back with /ti restore.
    enabled: true
    # Maximum entries kept in the log (oldest dropped first).
    max_items: 500
    # Entries older than this many days are pruned on startup.
    keep_days: 7
  blacklist:
    # Materials that may never receive a timer via /ti set, /ti add,
    # /ti give or the menu. Items already carrying a timer are unaffected.
    # Example: [TOTEM_OF_UNDYING, NETHERITE_CHESTPLATE]
    materials: []
